<text x="80" y="222" fill="#fff1e3" font-size="86" font-family="Georgia,serif">Kwitch Draw</text>
<text x="86" y="286" fill="#eec2d7" font-size="28">Sua criatividade merece um ritual.</text>
<text x="86" y="336" fill="#cbbccc" font-size="19">Desenhe. Aprenda. Compartilhe. Evolua.</text>
